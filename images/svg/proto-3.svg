<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#D8D8D8"/>

  <!-- one-step publish: build -> push -> hosted link -> viewers -->

  <!-- build / dist box -->
  <rect x="70" y="240" width="120" height="120" rx="8" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
  <g fill="#c8c6c2"><rect x="88" y="262" width="84" height="6" rx="2"/><rect x="88" y="278" width="64" height="6" rx="2"/><rect x="88" y="294" width="74" height="6" rx="2"/><rect x="88" y="310" width="54" height="6" rx="2"/></g>
  <text x="130" y="345" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7a7876" text-anchor="middle">build</text>

  <!-- base64 push dots -->
  <line x1="190" y1="300" x2="330" y2="300" stroke="#c8c6c2" stroke-width="1.2"/>
  <g fill="#9a9896">
    <circle cx="225" cy="300" r="3"/><circle cx="245" cy="300" r="3"/><circle cx="265" cy="300" r="3"/><circle cx="285" cy="300" r="3"/><circle cx="305" cy="300" r="3"/>
  </g>
  <text x="260" y="282" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9a9896" text-anchor="middle">API push</text>

  <!-- cloud / host node (blue accent) -->
  <circle cx="400" cy="300" r="46" fill="#faf9f7" stroke="#3B6FC2" stroke-width="2"/>
  <circle cx="400" cy="300" r="12" fill="#3B6FC2" opacity="0.8"/>
  <text x="400" y="372" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3B6FC2" text-anchor="middle">hosted</text>

  <!-- shareable link -->
  <line x1="446" y1="300" x2="560" y2="300" stroke="#c8c6c2" stroke-width="1.2"/>
  <rect x="500" y="288" width="14" height="24" rx="7" fill="none" stroke="#9a9896" stroke-width="1.4" transform="rotate(45 507 300)"/>
  <rect x="512" y="288" width="14" height="24" rx="7" fill="none" stroke="#9a9896" stroke-width="1.4" transform="rotate(45 519 300)"/>

  <!-- viewers / devices -->
  <g fill="#dddbd8" stroke="#9a9896" stroke-width="1.2">
    <rect x="600" y="200" width="60" height="44" rx="4"/>
    <rect x="680" y="250" width="44" height="64" rx="6"/>
    <rect x="600" y="330" width="60" height="44" rx="4"/>
  </g>
  <text x="660" y="410" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7a7876" text-anchor="middle">tested with customers</text>

  <!-- title -->
  <text x="70" y="120" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4a4946">From local build to a shareable link, in one step</text>
</svg>
