<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="56" y="56" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#262626">From Figma to system-accurate code</text>
  <text x="56" y="78" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8a8a8a">Code Connect maps each design component to its real implementation</text>

  <!-- Figma component card -->
  <rect x="56" y="120" width="240" height="150" rx="10" fill="#fafafa" stroke="#ececec"/>
  <rect x="56" y="120" width="240" height="30" rx="10" fill="#f0f0f0"/>
  <circle cx="74" cy="135" r="4" fill="#c8c8c8"/><circle cx="88" cy="135" r="4" fill="#dcdcdc"/>
  <rect x="116" y="185" width="120" height="36" rx="8" fill="#3B6FC2"/>
  <text x="176" y="208" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Save</text>
  <text x="176" y="252" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">Figma component</text>

  <!-- arrow + label -->
  <line x1="320" y1="195" x2="430" y2="195" stroke="#c8c8c8" stroke-width="1.5"/>
  <polygon points="428,189 442,195 428,201" fill="#c8c8c8"/>
  <text x="381" y="182" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3B6FC2" text-anchor="middle">Code Connect</text>

  <!-- code block -->
  <rect x="466" y="120" width="358" height="150" rx="10" fill="#fafafa" stroke="#ececec"/>
  <g font-family="SFMono-Regular, ui-monospace, monospace" font-size="13">
    <text x="490" y="158" fill="#9a9a9a">&lt;Button</text>
    <text x="512" y="182" fill="#6a6a6a">variant=</text>
    <text x="588" y="182" fill="#3B6FC2">"primary"</text>
    <text x="490" y="206" fill="#9a9a9a">&gt;Save&lt;/Button&gt;</text>
  </g>
  <text x="645" y="252" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">real component · no invented UI</text>

  <text x="56" y="330" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6a6a6a">One correct way to build a thing — exactly what a model needs.</text>
</svg>
