<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#f4f4f3"/>
  <!-- connections -->
  <g stroke="#d4d4d2" stroke-width="1.5">
    <line x1="400" y1="250" x2="250" y2="160"/>
    <line x1="400" y1="250" x2="250" y2="340"/>
    <line x1="400" y1="250" x2="560" y2="170"/>
    <line x1="400" y1="250" x2="560" y2="330"/>
  </g>
  <!-- outer nodes -->
  <g fill="#ffffff" stroke="#cfcfcd" stroke-width="1.5">
    <circle cx="250" cy="160" r="22"/>
    <circle cx="250" cy="340" r="22"/>
    <circle cx="560" cy="170" r="22"/>
    <circle cx="560" cy="330" r="22"/>
  </g>
  <!-- centre node (accent) -->
  <circle cx="400" cy="250" r="30" fill="#ffffff" stroke="#3B6FC2" stroke-width="2"/>
  <circle cx="400" cy="250" r="9" fill="#3B6FC2"/>
</svg>
