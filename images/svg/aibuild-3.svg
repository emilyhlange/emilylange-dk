<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#D8D8D8"/>

  <!-- left: clean token list -->
  <text x="90" y="130" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4a4946">Clear names, no special cases</text>
  <g>
    <rect x="90" y="160" width="36" height="36" rx="4" fill="#4a4946"/>
    <rect x="90" y="206" width="36" height="36" rx="4" fill="#6a6966"/>
    <rect x="90" y="252" width="36" height="36" rx="4" fill="#9a9896"/>
    <rect x="90" y="298" width="36" height="36" rx="4" fill="#c8c6c2"/>
  </g>
  <g fill="#9a9896">
    <rect x="140" y="174" width="120" height="6" rx="2"/>
    <rect x="140" y="220" width="100" height="6" rx="2"/>
    <rect x="140" y="266" width="130" height="6" rx="2"/>
    <rect x="140" y="312" width="90" height="6" rx="2"/>
  </g>

  <!-- arrow -->
  <line x1="320" y1="250" x2="430" y2="250" stroke="#9a9896" stroke-width="1.5"/>
  <polygon points="428,244 440,250 428,256" fill="#9a9896"/>

  <!-- right: predictable, consistent output -->
  <g fill="#faf9f7" stroke="#3B6FC2" stroke-width="1.6">
    <rect x="470" y="150" width="240" height="40" rx="20"/>
    <rect x="470" y="206" width="240" height="40" rx="20"/>
    <rect x="470" y="262" width="240" height="40" rx="20"/>
  </g>
  <g fill="#3B6FC2" opacity="0.7"><circle cx="494" cy="170" r="7"/><circle cx="494" cy="226" r="7"/><circle cx="494" cy="282" r="7"/></g>
  <g fill="#9a9896"><rect x="512" y="167" width="120" height="6" rx="2"/><rect x="512" y="223" width="150" height="6" rx="2"/><rect x="512" y="279" width="100" height="6" rx="2"/></g>
  <text x="590" y="330" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7a7876" text-anchor="middle">predictable output</text>

  <!-- blocked override path -->
  <line x1="470" y1="430" x2="710" y2="430" stroke="#c8c6c2" stroke-width="1.4" stroke-dasharray="6,5"/>
  <g stroke="#9a9896" stroke-width="2">
    <line x1="575" y1="412" x2="605" y2="448"/>
    <line x1="605" y1="412" x2="575" y2="448"/>
  </g>
  <text x="590" y="478" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9896" text-anchor="middle">no arbitrary overrides</text>
</svg>
