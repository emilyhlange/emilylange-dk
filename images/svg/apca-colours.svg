<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="56" y="60" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#262626">Colour, tuned on APCA</text>
  <text x="56" y="82" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8a8a8a">Perceptual contrast — future-proofed toward WCAG 3</text>

  <!-- neutral ramp -->
  <text x="56" y="124" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9a9a">Neutral</text>
  <g>
    <rect x="56"  y="134" width="84" height="56" rx="6" fill="#1a1a1a"/>
    <rect x="148" y="134" width="84" height="56" rx="6" fill="#3d3d3d"/>
    <rect x="240" y="134" width="84" height="56" rx="6" fill="#6a6a6a"/>
    <rect x="332" y="134" width="84" height="56" rx="6" fill="#9a9a9a"/>
    <rect x="424" y="134" width="84" height="56" rx="6" fill="#c8c8c8"/>
    <rect x="516" y="134" width="84" height="56" rx="6" fill="#e6e6e6" stroke="#ececec"/>
    <rect x="608" y="134" width="84" height="56" rx="6" fill="#f5f5f5" stroke="#ececec"/>
  </g>

  <!-- accent ramp -->
  <text x="56" y="232" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9a9a">Accent</text>
  <g>
    <rect x="56"  y="242" width="84" height="56" rx="6" fill="#1e3a6b"/>
    <rect x="148" y="242" width="84" height="56" rx="6" fill="#2d558f"/>
    <rect x="240" y="242" width="84" height="56" rx="6" fill="#3B6FC2"/>
    <rect x="332" y="242" width="84" height="56" rx="6" fill="#9db8e4"/>
    <rect x="424" y="242" width="84" height="56" rx="6" fill="#dde7f6" stroke="#ececec"/>
  </g>

  <!-- semantic -->
  <text x="56" y="340" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9a9a">Semantic</text>
  <g>
    <rect x="56"  y="350" width="84" height="56" rx="6" fill="#9c2b2b"/>
    <rect x="148" y="350" width="84" height="56" rx="6" fill="#2f7d4f"/>
    <rect x="240" y="350" width="84" height="56" rx="6" fill="#b07d1a"/>
  </g>

  <!-- contrast pair demo -->
  <rect x="724" y="242" width="100" height="164" rx="8" fill="#3B6FC2"/>
  <text x="774" y="318" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Aa</text>
  <text x="774" y="338" font-family="Inter, Arial, sans-serif" font-size="9" fill="#dde7f6" text-anchor="middle">legible</text>
</svg>
