<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#D8D8D8"/>

  <!-- Vertical pipeline backbone -->
  <line x1="300" y1="120" x2="300" y2="392" stroke="#c8c6c2" stroke-width="1.5"/>
  <polygon points="296,250 300,260 304,250" fill="#c8c6c2"/>
  <polygon points="296,372 300,382 304,372" fill="#c8c6c2"/>

  <!-- Stage: prompt -->
  <rect x="200" y="92" width="200" height="56" rx="28" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
  <rect x="226" y="114" width="78" height="5" rx="2" fill="#6a6966"/>
  <rect x="226" y="124" width="50" height="4" rx="1" fill="#9a9896"/>

  <!-- Stage: build -->
  <rect x="200" y="212" width="200" height="56" rx="28" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
  <rect x="226" y="234" width="60" height="5" rx="2" fill="#6a6966"/>
  <rect x="226" y="244" width="44" height="4" rx="1" fill="#9a9896"/>

  <!-- Stage: host / shareable link (blue accent) -->
  <rect x="200" y="332" width="200" height="56" rx="28" fill="#faf9f7" stroke="#3B6FC2" stroke-width="2"/>
  <circle cx="232" cy="360" r="7" fill="#3B6FC2" opacity="0.85"/>
  <rect x="250" y="354" width="110" height="5" rx="2" fill="#3B6FC2" opacity="0.7"/>
  <rect x="250" y="364" width="70" height="4" rx="1" fill="#9a9896"/>

  <!-- Fan-out to many users (democratisation) -->
  <line x1="240" y1="388" x2="120" y2="470" stroke="#c8c6c2" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="300" y1="392" x2="300" y2="470" stroke="#c8c6c2" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="388" x2="480" y2="470" stroke="#c8c6c2" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- User grid -->
  <g fill="#dddbd8" stroke="#9a9896" stroke-width="1">
    <circle cx="120" cy="500" r="16"/>
    <circle cx="210" cy="500" r="16"/>
    <circle cx="390" cy="500" r="16"/>
    <circle cx="480" cy="500" r="16"/>
    <circle cx="165" cy="580" r="16"/>
    <circle cx="435" cy="580" r="16"/>
  </g>
  <circle cx="300" cy="500" r="18" fill="#6a6966"/>
  <circle cx="255" cy="580" r="16" fill="#dddbd8" stroke="#9a9896" stroke-width="1"/>
  <circle cx="345" cy="580" r="16" fill="#dddbd8" stroke="#9a9896" stroke-width="1"/>

  <!-- Feedback loop arc (the learning loop) -->
  <path d="M 168 560 C 70 520, 70 200, 174 130" fill="none" stroke="#9a9896" stroke-width="1.2" stroke-dasharray="5,4"/>
  <polygon points="170,138 176,128 182,138" fill="#9a9896"/>
  <text x="58" y="350" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9896" transform="rotate(-90 58 350)">learns each session</text>

  <!-- Caption -->
  <text x="300" y="700" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7a7876" text-anchor="middle">prompt → build → host → test</text>
</svg>
