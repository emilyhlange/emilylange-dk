<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#D8D8D8"/>

  <!-- Figma frame (top) -->
  <rect x="170" y="100" width="260" height="150" rx="6" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
  <rect x="170" y="100" width="260" height="26" rx="6" fill="#e8e7e4"/>
  <circle cx="186" cy="113" r="4" fill="#9a9896"/>
  <circle cx="200" cy="113" r="4" fill="#c8c6c2"/>
  <rect x="192" y="150" width="100" height="60" rx="4" fill="#dddbd8" stroke="#c8c6c2" stroke-width="1"/>
  <rect x="306" y="150" width="100" height="26" rx="13" fill="#dddbd8" stroke="#c8c6c2" stroke-width="1"/>
  <rect x="306" y="186" width="100" height="24" rx="4" fill="#dddbd8" stroke="#c8c6c2" stroke-width="1"/>
  <text x="300" y="240" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7a7876" text-anchor="middle">design</text>

  <!-- token chips feeding the bridge -->
  <g fill="#faf9f7" stroke="#c8c6c2" stroke-width="1">
    <rect x="60" y="300" width="86" height="22" rx="11"/>
    <rect x="60" y="332" width="86" height="22" rx="11"/>
    <rect x="60" y="364" width="86" height="22" rx="11"/>
  </g>
  <g fill="#9a9896"><rect x="74" y="309" width="50" height="4" rx="2"/><rect x="74" y="341" width="58" height="4" rx="2"/><rect x="74" y="373" width="42" height="4" rx="2"/></g>
  <text x="103" y="296" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9a9896" text-anchor="middle">tokens</text>
  <line x1="146" y1="343" x2="250" y2="360" stroke="#c8c6c2" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- bridge node (blue) Code Connect / MCP -->
  <line x1="300" y1="250" x2="300" y2="320" stroke="#c8c6c2" stroke-width="1.5"/>
  <polygon points="296,318 300,328 304,318" fill="#c8c6c2"/>
  <rect x="220" y="328" width="160" height="50" rx="25" fill="#faf9f7" stroke="#3B6FC2" stroke-width="2"/>
  <text x="300" y="358" font-family="Inter, Arial, sans-serif" font-size="12" fill="#3B6FC2" text-anchor="middle">read by machine</text>
  <line x1="300" y1="378" x2="300" y2="430" stroke="#c8c6c2" stroke-width="1.5"/>
  <polygon points="296,428 300,438 304,428" fill="#c8c6c2"/>

  <!-- code block (bottom) -->
  <rect x="170" y="440" width="260" height="170" rx="6" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11">
    <text x="190" y="470" fill="#9a9896">&lt;Button</text>
    <text x="210" y="490" fill="#6a6966">variant=</text>
    <text x="270" y="490" fill="#3B6FC2">"primary"</text>
    <text x="190" y="510" fill="#9a9896">/&gt;</text>
    <text x="190" y="540" fill="#9a9896">&lt;Field</text>
    <text x="210" y="560" fill="#6a6966">label=</text>
    <text x="256" y="560" fill="#3B6FC2">"Amount"</text>
    <text x="190" y="580" fill="#9a9896">/&gt;</text>
  </g>
  <text x="300" y="602" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7a7876" text-anchor="middle"></text>

  <!-- no-override lock motif -->
  <g transform="translate(470 520)">
    <rect x="0" y="14" width="34" height="26" rx="4" fill="#dddbd8" stroke="#9a9896" stroke-width="1.4"/>
    <path d="M 6 14 V 8 a 11 11 0 0 1 22 0 V 14" fill="none" stroke="#9a9896" stroke-width="1.4"/>
    <circle cx="17" cy="26" r="3" fill="#6a6966"/>
  </g>
  <text x="487" y="578" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9a9896" text-anchor="middle">one way</text>

  <text x="300" y="690" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7a7876" text-anchor="middle">system-accurate by default</text>
</svg>
