<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#D8D8D8"/>

  <!-- 5-phase process map, left to right -->
  <line x1="120" y1="220" x2="690" y2="220" stroke="#c8c6c2" stroke-width="1.5"/>
  <g fill="#c8c6c2">
    <polygon points="250,216 260,220 250,224"/>
    <polygon points="390,216 400,220 390,224"/>
    <polygon points="530,216 540,220 530,224"/>
    <polygon points="670,216 680,220 670,224"/>
  </g>

  <!-- Phase nodes -->
  <g>
    <circle cx="130" cy="220" r="26" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
    <circle cx="270" cy="220" r="26" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
    <circle cx="410" cy="220" r="26" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
    <circle cx="550" cy="220" r="30" fill="#faf9f7" stroke="#3B6FC2" stroke-width="2"/>
    <circle cx="550" cy="220" r="10" fill="#3B6FC2" opacity="0.8"/>
    <circle cx="690" cy="220" r="26" fill="#faf9f7" stroke="#9a9896" stroke-width="1.5"/>
  </g>

  <!-- Phase labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#6a6966" text-anchor="middle">
    <text x="130" y="285">Context</text>
    <text x="270" y="285">Foundations</text>
    <text x="410" y="285">Build</text>
    <text x="550" y="290">Test</text>
    <text x="690" y="285">Maintain</text>
  </g>

  <!-- Sub-skill chips under build -->
  <g fill="#faf9f7" stroke="#c8c6c2" stroke-width="1">
    <rect x="350" y="330" width="120" height="26" rx="13"/>
    <rect x="350" y="366" width="120" height="26" rx="13"/>
    <rect x="350" y="402" width="120" height="26" rx="13"/>
  </g>
  <g fill="#9a9896">
    <rect x="366" y="341" width="64" height="4" rx="2"/>
    <rect x="366" y="377" width="80" height="4" rx="2"/>
    <rect x="366" y="413" width="56" height="4" rx="2"/>
  </g>
  <line x1="410" y1="250" x2="410" y2="330" stroke="#c8c6c2" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Maintenance band (cross-cutting) -->
  <rect x="100" y="470" width="610" height="40" rx="8" fill="none" stroke="#9a9896" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="405" y="495" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9a9896" text-anchor="middle">log · reflect — captured every session</text>

  <!-- title -->
  <text x="120" y="90" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4a4946">The kit as a system</text>
</svg>
