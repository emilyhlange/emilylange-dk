<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="56" y="64" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#262626">Spacing scale</text>
  <text x="56" y="86" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8a8a8a">Semantic tokens on a 4-point base</text>

  <!-- rows: token name | bar | px -->
  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <!-- 0 -->
    <text x="56" y="140" fill="#6a6a6a">spacing-0</text>
    <rect x="180" y="131" width="4" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="140" fill="#9a9a9a" text-anchor="end">0</text>
    <!-- 1 -->
    <text x="56" y="172" fill="#6a6a6a">spacing-1</text>
    <rect x="180" y="163" width="16" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="172" fill="#9a9a9a" text-anchor="end">4</text>
    <!-- 2 -->
    <text x="56" y="204" fill="#6a6a6a">spacing-2</text>
    <rect x="180" y="195" width="32" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="204" fill="#9a9a9a" text-anchor="end">8</text>
    <!-- 3 -->
    <text x="56" y="236" fill="#6a6a6a">spacing-3</text>
    <rect x="180" y="227" width="48" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="236" fill="#9a9a9a" text-anchor="end">12</text>
    <!-- 4 -->
    <text x="56" y="268" fill="#6a6a6a">spacing-4</text>
    <rect x="180" y="259" width="64" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="268" fill="#9a9a9a" text-anchor="end">16</text>
    <!-- 6 -->
    <text x="56" y="300" fill="#6a6a6a">spacing-6</text>
    <rect x="180" y="291" width="96" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="300" fill="#9a9a9a" text-anchor="end">24</text>
    <!-- 8 -->
    <text x="56" y="332" fill="#6a6a6a">spacing-8</text>
    <rect x="180" y="323" width="128" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="332" fill="#9a9a9a" text-anchor="end">32</text>
    <!-- 12 -->
    <text x="56" y="364" fill="#6a6a6a">spacing-12</text>
    <rect x="180" y="355" width="192" height="14" rx="2" fill="#3B6FC2"/>
    <text x="824" y="364" fill="#9a9a9a" text-anchor="end">48</text>
  </g>
  <line x1="824" y1="120" x2="824" y2="376" stroke="#ececec" stroke-width="1"/>
</svg>
